services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vulnradar
      POSTGRES_PASSWORD: vulnradar_dev_2026
      POSTGRES_DB: vulnradar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://vulnradar:vulnradar_dev_2026@db:5432/vulnradar
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata: